      ============================================================
      ADD YOUR PHOTOS HERE
      ============================================================
      Each photo is a <figure class="photo">. Inside, put:
        <img src="images/portraits/01.jpg" alt="Description">

      Aspect ratio classes (mix freely for natural rhythm):
        tall      = 3:4   (portraits — most common)
        wide      = 4:3
        square    = 1:1
        portrait  = 2:3   (more vertical)
        landscape = 3:2

      Placeholder classes (ph-1 to ph-12) give a colored fill
      until you add real photos. REMOVE them when you add <img>.

      Example with a real photo:
        <figure class="photo tall">
          <img src="images/portraits/01.jpg" alt="Marie at golden hour">
        </figure>
      ============================================================
    -->
